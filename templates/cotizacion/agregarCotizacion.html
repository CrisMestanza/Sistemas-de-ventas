{% extends 'plantilla/base.html' %}
{% block main %}
<main id="main" class="main">
    <div class="pagetitle">
        <h1>Cotizaciones</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active">Nueva Cotización</li>
            </ol>
        </nav>
    </div>

    <section class="section dashboard">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Nueva Cotización</h5>

                        <h4>Datos del cliente:</h4>
                        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
                            <div>
                                <label>Nº Documento (DNI/RUC)</label>
                                <div class="input-group">
                                    <input class="form-control" type="text" id="doccliente" maxlength="11" placeholder="DNI o RUC" style="width:150px;">
                                    <input type="button" class="btn btn-dark" value="Buscar" id="consultar">
                                </div>
                            </div>
                            <div>
                                <label>Razón social / Nombres completos</label>
                                <input class="form-control" type="text" id="nomcliente" readonly style="width:380px;" placeholder="Se completa al buscar">
                            </div>
                            <div>
                                <label>Dirección</label>
                                <input class="form-control" type="text" id="dircliente" readonly style="width:280px;" placeholder="—">
                            </div>
                            <div id="msgCliente" style="font-size:12px; color:green; align-self:center; margin-top:18px;"></div>
                            <input type="hidden" id="idclienteHidden">
                        </div>

                        <br>
                        <h4>Datos de los productos:</h4>
                        <br>

                        <form id="formCotizacion" autocomplete="off">
                            {% csrf_token %}
                            <input type="hidden" name="idcliente" id="idclienteForm">

                            <table class="table table-bordered table-hover" id="tablaCotizacion">
                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Descripción</th>
                                        <th>Cantidad</th>
                                        <th>Precio Unitario</th>
                                        <th>Subtotal</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoItems">
                                    <tr>
                                        <td>
                                            <div class="input-group">
                                                <input class="form-control busqueda-prod" type="text" list="dl-0"
                                                    name="producto[]" placeholder="Buscar producto..." required>
                                                <datalist id="dl-0"></datalist>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="input-group">
                                                <input class="form-control" type="text" name="descripcion[]" placeholder="Opcional">
                                            </div>
                                        </td>
                                        <td>
                                            <div class="input-group">
                                                <input class="form-control campo-cant" type="number" name="cantidad[]"
                                                    min="0.01" step="0.01" value="1" required style="width:80px;">
                                            </div>
                                        </td>
                                        <td>
                                            <div class="input-group">
                                                <input class="form-control campo-precio" type="number" name="preciounitario[]"
                                                    min="0" step="0.01" value="0.00" required style="width:100px;">
                                            </div>
                                        </td>
                                        <td>
                                            <div class="input-group">
                                                <input class="form-control subtotal-field" type="number" name="subtotal[]"
                                                    readonly value="0.00" style="width:100px;">
                                            </div>
                                        </td>
                                        <td>
                                            <button type="button" class="btn btn-danger btn-sm" onclick="quitarFila(this)">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px;">
                                <button type="button" class="btn btn-success" id="btnAgregarFila">
                                    <i class="bi bi-plus-circle"></i> Agregar producto
                                </button>

                                <div style="display:flex; align-items:center; gap:20px;">
                                    <div class="input-group" style="width:320px;">
                                        <label class="input-group-text">Observaciones</label>
                                        <input type="text" class="form-control" id="observaciones" name="observaciones" placeholder="Opcional">
                                    </div>
                                    <h5 style="margin:0;">Total: <strong id="totalGeneral" style="color:#198754;">S/. 0.00</strong></h5>
                                    <button type="button" class="btn btn-primary" id="btnGuardar">
                                        <i class="bi bi-save"></i> Guardar Cotización
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const CSRF = '{{ csrf_token }}';
    let dlCounter = 0;

    // ── Búsqueda de cliente ───────────────────────────────────────────────────
    document.getElementById('consultar').addEventListener('click', buscarCliente);
    document.getElementById('doccliente').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); buscarCliente(); }
    });

    function buscarCliente() {
        const doc = document.getElementById('doccliente').value.trim();
        const msg = document.getElementById('msgCliente');
        if (!doc) return;

        msg.textContent = 'Buscando...';
        msg.style.color = '#555';

        fetch("{% url 'cotizacionBuscarCliente' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `doc=${encodeURIComponent(doc)}&csrfmiddlewaretoken=${CSRF}`
        })
        .then(r => r.json())
        .then(res => {
            if (res.error) {
                msg.textContent = '✗ ' + res.error;
                msg.style.color = 'red';
                return;
            }
            document.getElementById('nomcliente').value = res.nombre;
            document.getElementById('dircliente').value = res.direccion || '-';
            document.getElementById('idclienteHidden').value = res.idcliente;
            document.getElementById('idclienteForm').value = res.idcliente;
            msg.textContent = res.created ? '✓ Cliente nuevo guardado.' : '✓ Cliente encontrado.';
            msg.style.color = 'green';
        })
        .catch(() => { msg.textContent = 'Error al consultar.'; msg.style.color = 'red'; });
    }

    // ── Búsqueda de productos ─────────────────────────────────────────────────
    let searchTimer = null;

    document.getElementById('cuerpoItems').addEventListener('input', function (e) {
        const el = e.target;

        if (el.classList.contains('busqueda-prod')) {
            clearTimeout(searchTimer);
            const fila = el.closest('tr');
            const datalist = fila.querySelector('datalist');
            const val = el.value.trim();
            if (!val) return;

            searchTimer = setTimeout(() => {
                fetch("{% url 'buscarProducto' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `busqueda=${encodeURIComponent(val)}&csrfmiddlewaretoken=${CSRF}`
                })
                .then(r => r.json())
                .then(res => {
                    datalist.innerHTML = '';
                    res.productos.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.nomproducto;
                        opt.dataset.precio = p.preciounitario;
                        datalist.appendChild(opt);
                    });
                    if (res.producto_exacto && el.value.toLowerCase() === res.producto_exacto.nomproducto.toLowerCase()) {
                        fila.querySelector('.campo-precio').value = parseFloat(res.producto_exacto.preciounitario).toFixed(2);
                        calcularSubtotal(fila);
                    }
                });
            }, 300);
        }

        if (el.classList.contains('campo-cant') || el.classList.contains('campo-precio')) {
            calcularSubtotal(el.closest('tr'));
        }
    });

    document.getElementById('cuerpoItems').addEventListener('change', function (e) {
        const el = e.target;
        if (!el.classList.contains('busqueda-prod')) return;
        const fila = el.closest('tr');
        const datalist = fila.querySelector('datalist');
        const opcion = Array.from(datalist.options).find(o => o.value === el.value);
        if (opcion && opcion.dataset.precio) {
            fila.querySelector('.campo-precio').value = parseFloat(opcion.dataset.precio).toFixed(2);
            calcularSubtotal(fila);
        } else {
            fetch("{% url 'buscarProducto' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `busqueda=${encodeURIComponent(el.value)}&csrfmiddlewaretoken=${CSRF}`
            })
            .then(r => r.json())
            .then(res => {
                if (res.producto_exacto) {
                    fila.querySelector('.campo-precio').value = parseFloat(res.producto_exacto.preciounitario).toFixed(2);
                    calcularSubtotal(fila);
                }
            });
        }
    });

    // ── Cálculo ───────────────────────────────────────────────────────────────
    function calcularSubtotal(fila) {
        const cant = parseFloat(fila.querySelector('.campo-cant').value) || 0;
        const precio = parseFloat(fila.querySelector('.campo-precio').value) || 0;
        fila.querySelector('.subtotal-field').value = (cant * precio).toFixed(2);
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll('.subtotal-field').forEach(el => total += parseFloat(el.value) || 0);
        document.getElementById('totalGeneral').textContent = 'S/. ' + total.toFixed(2);
    }

    // ── Filas ─────────────────────────────────────────────────────────────────
    function quitarFila(btn) {
        if (document.querySelectorAll('#cuerpoItems tr').length === 1) return;
        btn.closest('tr').remove();
        calcularTotal();
    }

    document.getElementById('btnAgregarFila').addEventListener('click', function () {
        dlCounter++;
        const tbody = document.getElementById('cuerpoItems');
        const fila = document.createElement('tr');
        fila.innerHTML = `
            <td>
                <div class="input-group">
                    <input class="form-control busqueda-prod" type="text" list="dl-${dlCounter}"
                        name="producto[]" placeholder="Buscar producto..." required>
                    <datalist id="dl-${dlCounter}"></datalist>
                </div>
            </td>
            <td><div class="input-group"><input class="form-control" type="text" name="descripcion[]" placeholder="Opcional"></div></td>
            <td><div class="input-group"><input class="form-control campo-cant" type="number" name="cantidad[]" min="0.01" step="0.01" value="1" required style="width:80px;"></div></td>
            <td><div class="input-group"><input class="form-control campo-precio" type="number" name="preciounitario[]" min="0" step="0.01" value="0.00" required style="width:100px;"></div></td>
            <td><div class="input-group"><input class="form-control subtotal-field" type="number" name="subtotal[]" readonly value="0.00" style="width:100px;"></div></td>
            <td><button type="button" class="btn btn-danger btn-sm" onclick="quitarFila(this)"><i class="bi bi-trash"></i></button></td>`;
        tbody.appendChild(fila);
    });

    // ── Guardar ───────────────────────────────────────────────────────────────
    document.getElementById('btnGuardar').addEventListener('click', function () {
        if (!document.getElementById('idclienteForm').value) {
            Swal.fire({ title: 'Cliente requerido', text: 'Busque y seleccione un cliente primero.', icon: 'warning', confirmButtonText: 'Ok' });
            document.getElementById('doccliente').focus();
            return;
        }

        const form = document.getElementById('formCotizacion');
        if (!form.checkValidity()) { form.reportValidity(); return; }

        fetch("{% url 'cotizacionGuardar' %}", { method: 'POST', body: new FormData(form) })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                Swal.fire({
                    title: 'Cotización guardada',
                    icon: 'success',
                    confirmButtonText: 'Ok'
                }).then(() => {
                    window.location.href = "{% url 'cotizaciones' %}";
                });
            } else {
                Swal.fire({ title: 'Error', text: res.error, icon: 'error', confirmButtonText: 'Ok' });
            }
        })
        .catch(() => Swal.fire({ title: 'Error', text: 'No se pudo guardar.', icon: 'error' }));
    });
</script>
{% endblock %}
