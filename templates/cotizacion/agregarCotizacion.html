{% extends 'plantilla/base.html' %}
{% block main %}
<main id="main" class="main">
  <div class="pagetitle">
    <h1>Nueva Cotización</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Inicio</a></li>
        <li class="breadcrumb-item"><a href="{% url 'cotizaciones' %}">Cotizaciones</a></li>
        <li class="breadcrumb-item active">Nueva</li>
      </ol>
    </nav>
  </div>

  <section class="section">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Datos de la Cotización</h5>
            <form id="formCotizacion">
              {% csrf_token %}
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Cliente <span class="text-danger">*</span></label>
                  <select name="idcliente" id="idcliente" class="form-select" required>
                    <option value="">-- Seleccionar cliente --</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.idcliente }}">{{ cliente.razonsocial }} — {{ cliente.numdoc }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Observaciones</label>
                  <input type="text" name="observaciones" class="form-control" placeholder="Opcional...">
                </div>
              </div>

              <!-- Tabla de ítems -->
              <div class="table-responsive mb-3">
                <table class="table table-bordered align-middle" id="tablaItems">
                  <thead class="table-dark">
                    <tr>
                      <th style="width:5%">#</th>
                      <th style="width:22%">Producto</th>
                      <th style="width:25%">Descripción</th>
                      <th style="width:10%">Cantidad</th>
                      <th style="width:13%">P. Unitario</th>
                      <th style="width:13%">Subtotal</th>
                      <th style="width:7%"></th>
                    </tr>
                  </thead>
                  <tbody id="cuerpoItems">
                    <tr id="fila-1">
                      <td class="text-center num-fila">1</td>
                      <td><input type="text" name="producto[]" class="form-control form-control-sm" placeholder="Producto" required></td>
                      <td><input type="text" name="descripcion[]" class="form-control form-control-sm" placeholder="Descripción"></td>
                      <td><input type="number" name="cantidad[]" class="form-control form-control-sm campo-calc" min="0.01" step="0.01" value="1" required></td>
                      <td><input type="number" name="preciounitario[]" class="form-control form-control-sm campo-calc" min="0" step="0.01" value="0.00" required></td>
                      <td><input type="number" name="subtotal[]" class="form-control form-control-sm subtotal-field" readonly value="0.00"></td>
                      <td class="text-center">
                        <button type="button" class="btn btn-sm btn-danger btn-quitar" onclick="quitarFila(this)">
                          <i class="bi bi-dash-circle"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <button type="button" class="btn btn-outline-success" id="btnAgregarFila">
                  <i class="bi bi-plus-circle me-1"></i> Agregar ítem
                </button>
                <div class="d-flex align-items-center gap-3">
                  <h5 class="mb-0">Total: <span class="text-success fw-bold" id="totalGeneral">S/. 0.00</span></h5>
                  <button type="button" class="btn btn-primary px-4" id="btnGuardar">
                    <i class="bi bi-save me-1"></i> Guardar Cotización
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  let numFilas = 1;

  function calcularSubtotal(fila) {
    const cant = parseFloat(fila.querySelector('[name="cantidad[]"]').value) || 0;
    const precio = parseFloat(fila.querySelector('[name="preciounitario[]"]').value) || 0;
    const sub = (cant * precio).toFixed(2);
    fila.querySelector('.subtotal-field').value = sub;
    calcularTotal();
  }

  function calcularTotal() {
    let total = 0;
    document.querySelectorAll('.subtotal-field').forEach(el => {
      total += parseFloat(el.value) || 0;
    });
    document.getElementById('totalGeneral').textContent = 'S/. ' + total.toFixed(2);
  }

  function quitarFila(btn) {
    const filas = document.querySelectorAll('#cuerpoItems tr');
    if (filas.length === 1) return;
    btn.closest('tr').remove();
    renumerarFilas();
    calcularTotal();
  }

  function renumerarFilas() {
    document.querySelectorAll('#cuerpoItems tr .num-fila').forEach((td, i) => {
      td.textContent = i + 1;
    });
  }

  document.getElementById('btnAgregarFila').addEventListener('click', function () {
    numFilas++;
    const tbody = document.getElementById('cuerpoItems');
    const fila = document.createElement('tr');
    fila.innerHTML = `
      <td class="text-center num-fila">${tbody.children.length + 1}</td>
      <td><input type="text" name="producto[]" class="form-control form-control-sm" placeholder="Producto" required></td>
      <td><input type="text" name="descripcion[]" class="form-control form-control-sm" placeholder="Descripción"></td>
      <td><input type="number" name="cantidad[]" class="form-control form-control-sm campo-calc" min="0.01" step="0.01" value="1" required></td>
      <td><input type="number" name="preciounitario[]" class="form-control form-control-sm campo-calc" min="0" step="0.01" value="0.00" required></td>
      <td><input type="number" name="subtotal[]" class="form-control form-control-sm subtotal-field" readonly value="0.00"></td>
      <td class="text-center">
        <button type="button" class="btn btn-sm btn-danger btn-quitar" onclick="quitarFila(this)">
          <i class="bi bi-dash-circle"></i>
        </button>
      </td>`;
    tbody.appendChild(fila);
    fila.querySelectorAll('.campo-calc').forEach(inp => {
      inp.addEventListener('input', () => calcularSubtotal(fila));
    });
  });

  document.getElementById('cuerpoItems').addEventListener('input', function (e) {
    if (e.target.classList.contains('campo-calc')) {
      calcularSubtotal(e.target.closest('tr'));
    }
  });

  document.getElementById('btnGuardar').addEventListener('click', function () {
    const form = document.getElementById('formCotizacion');
    if (!form.checkValidity()) { form.reportValidity(); return; }

    const data = new FormData(form);
    fetch("{% url 'cotizacionGuardar' %}", { method: 'POST', body: data })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          window.location.href = `/cotizaciones/imprimir/${res.id}`;
        } else {
          alert('Error: ' + res.error);
        }
      })
      .catch(() => alert('Error al guardar'));
  });
</script>
{% endblock %}
